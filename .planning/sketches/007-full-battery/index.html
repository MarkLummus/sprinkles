<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 007: the full battery</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ---------- sketch chrome (not the design) ---------- */
html { background: #e9e9e4; }
body { margin: 0; padding-top: 0; font-family: var(--face-grotesk); color: var(--ink); }
#variant-nav { position: relative; top: 0; left: 0; right: 0; z-index: 9998; background: #1c1c1c; color: #eee; display: flex; align-items: center; gap: 6px; padding: 8px 14px; font: 12px/1.3 system-ui; flex-wrap: wrap; }
#variant-nav .sep { width: 1px; height: 22px; background: #555; margin: 0 6px; }
#variant-nav button { font: inherit; background: #333; color: #ddd; border: 1px solid #555; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
#variant-nav button:hover { background: #444; }
#variant-nav button.active { background: #f7f7f4; color: #141414; border-color: #f7f7f4; }
#variant-nav .note { color: #aaa; margin-left: auto; }
.frame { margin: 24px auto; background: var(--ground); outline: 1px dashed #b5b5ae; padding: var(--gap-xl); box-sizing: border-box; }
.ruler { position: absolute; right: -1px; top: 0; width: 1px; background: repeating-linear-gradient(to bottom, #c66 0 1px, transparent 1px 100px); }
.ruler .mark { position: absolute; right: 4px; font: 10px/1 ui-monospace, Menlo, monospace; color: #c66; transform: translateY(-50%); }

/* ---------- the world ---------- */
.app { font-family: var(--face-grotesk); font-size: var(--size-table-body); line-height: 1.35; color: var(--ink); background: var(--ground); position: relative; }
.app *:focus-visible { outline: var(--focus-outline-width) solid var(--ink); outline-offset: var(--focus-outline-offset); }
button, input, textarea { font: inherit; }
.app p { margin: 0; }
.btn { font-family: var(--face-grotesk); font-size: var(--size-table-body); color: var(--ink); background: none; border: var(--rule-ink-field) solid var(--ink); border-radius: 0; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-width: 1.5px; padding: 5.5px 11.5px; }
.text-control { font-family: var(--face-grotesk); font-size: var(--size-small-print); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.text-control:hover { text-decoration-thickness: 1.5px; }
.region-name { font-family: var(--face-grotesk); font-size: var(--size-running-head); text-transform: uppercase; letter-spacing: 0.04em; color: var(--bookcloth); margin: 0 0 var(--gap-s); font-weight: 400; }
.ink-field { font-family: var(--face-grotesk); font-size: var(--size-ink-field); font-variant-numeric: tabular-nums; color: var(--pen-blue); border: var(--rule-ink-field) solid var(--ink); border-radius: 0; background: none; padding: 2px 6px; }
.prose-field { font-family: var(--face-text); font-size: var(--size-headnote-prose); color: var(--pen-blue); border: 0; border-bottom: 2px solid var(--ink); background: none; padding: 2px 0; width: 100%; resize: none; line-height: 1.4; box-sizing: border-box; field-sizing: content; }
label { display: block; margin: 0 0 var(--gap-s); }
label:has(+ .seg) { margin-bottom: var(--gap-xs); }
.lbl { display: block; font-size: var(--size-small-print); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--gap-xs); }
.field-row { display: flex; gap: var(--gap-s); flex-wrap: wrap; align-items: flex-end; }
.field-row label { flex: 0 0 auto; }
.field-row label > span.lbl { display: flex; align-items: flex-end; white-space: normal; line-height: 1.2; min-height: 2.4em; }
.num-field { width: 100%; box-sizing: border-box; text-align: right; }
.f-date { width: 128px; }
.field-unit { display: flex; align-items: baseline; gap: 4px; }
.field-unit .num-field { width: 48px; flex: 0 0 auto; }
.field-unit .u { font-size: var(--size-deviation-words); white-space: nowrap; }

/* ---------- segmented (3-way categorical) control ---------- */
.seg { display: flex; margin: 0 0 var(--gap-s); }
.seg .opt { font-size: var(--size-small-print); border: var(--rule-ink-field) solid var(--ink); background: none; padding: 5px 10px; cursor: pointer; margin-right: -1px; }
.seg .opt.on { background: var(--pen-blue); border-color: var(--pen-blue); color: var(--ground); position: relative; z-index: 1; }

/* ---------- pen shell ---------- */
.pen { max-width: 640px; }
.pen section + section { margin-top: var(--gap-l); padding-top: var(--gap-m); border-top: var(--rule-graduation) solid var(--ink); }
.pen section + .next-time-shared { margin-top: var(--gap-l); }
.pen .saves { display: flex; gap: var(--gap-s); margin-top: var(--gap-l); }

/* ---------- axis groups: core left, recipe-declared right of a vertical hairline ---------- */
#axes { display: grid; grid-template-columns: 1fr; gap: 0 var(--gap-l); }
.axes-core, .axes-declared { display: grid; grid-template-columns: 1fr; gap: 0 var(--gap-l); }
.axes-declared { border-top: var(--rule-graduation) solid var(--ink); padding-top: var(--gap-s); }
[data-cols="2"] .axes-core, [data-cols="2"] .axes-declared { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
/* 3-column desktop: one row-major grid — tab order follows the eye; the declared column sits right of the hairline */
@media (min-width: 761px) {
  [data-cols="3"] #axes { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 0; position: relative; }
  [data-cols="3"] .axis--declared { padding-left: var(--gap-s); }
  [data-cols="3"] .axes-rule { position: absolute; top: 0; bottom: 0; left: calc(200% / 3); border-left: var(--rule-graduation) solid var(--ink); pointer-events: none; }
}

/* ---------- goldilocks axis row: 5 numbered stops ---------- */
.head { display: flex; align-items: baseline; gap: var(--gap-s); }
.axis { margin: 0 0 var(--gap-m); min-width: 0; }
.axis .head { margin-bottom: var(--gap-xs); min-height: 24px; }
.axis .name { font-size: var(--size-small-print); text-transform: uppercase; letter-spacing: 0.04em; }
.axis .state { font-size: var(--size-small-print); }
.axis .state.pen { color: var(--pen-blue); font-family: var(--face-grotesk); }
.axis .state.unmarked { color: #777; font-style: italic; font-family: var(--face-text); }
.axis .stops5 { display: flex; gap: 4px; width: 186px; }
.axis .stop5 { width: 34px; height: 24px; box-sizing: border-box; border: 1px solid var(--ink); background: none; padding: 0; cursor: pointer; font-family: var(--face-grotesk); font-size: var(--size-ink-field); font-variant-numeric: tabular-nums; color: var(--ink); }
.axis .stop5:hover { border-width: 1.5px; }
.axis .stop5.on { background: var(--pen-blue); border-color: var(--pen-blue); color: var(--ground); }
.axis .anchors5 { display: flex; justify-content: space-between; width: 186px; margin-top: 2px; font-size: var(--size-deviation-words); font-style: italic; font-family: var(--face-text); color: #555; white-space: nowrap; }

/* ---------- defect chips ---------- */
.chip-toggle { border: var(--rule-ink-field) solid var(--ink); padding: 3px 10px; background: none; cursor: pointer; font-size: var(--size-small-print); margin: 0 6px 6px 0; }
.chip-toggle.on { background: var(--pen-blue); border-color: var(--pen-blue); color: var(--ground); }
.defect-chips { display: flex; flex-wrap: wrap; margin-top: 4px; }
.declared-flaw { margin-left: var(--gap-m); }

/* ---------- tasting body: flex column, order toggled by variant ---------- */
#tasting-body { display: flex; flex-direction: column; }
#tasting-body > * { order: 3; }
#tasting-body .field-row { order: 1; }
#tasting-body .note-block { order: 2; margin-bottom: var(--gap-m); }
#tasting-body .texture-block { order: 3; }
#tasting-body .melt-block { order: 5; margin-top: var(--gap-m); }

/* A: note before Texture & flavor (the concept sketch's flow) */
[data-variant="A"] #tasting-body .note-block { order: 2; }
[data-variant="A"] #tasting-body .texture-block { order: 3; }

/* C: note after Texture & flavor / Any problems */
[data-variant="C"] #tasting-body .texture-block { order: 2; }
[data-variant="C"] #tasting-body .note-block { order: 4; margin-top: var(--gap-m); margin-bottom: 0; }

/* Hardening: preserve the paper layout while allowing narrower viewports. */
.frame { width: min(760px, calc(100% - 24px)); }
/* the side-by-side split only fits at the pen's full 640px width; below that, step down to
   the 2-column arrangement (groups stacked, horizontal rule) — auto-fit then collapses each
   group to one column when two 280px columns no longer fit */
@media (max-width: 760px) {
  [data-cols="3"] #axes { grid-template-columns: 1fr; }
  [data-cols="3"] .axes-core { grid-column: auto; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  [data-cols="3"] .axes-declared { grid-column: auto; min-width: 0; border-left: 0; padding-left: 0; border-top: var(--rule-graduation) solid var(--ink); padding-top: var(--gap-s); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
}
.head { flex-wrap: wrap; }
.category-row { display: flex; gap: var(--gap-l); flex-wrap: wrap; }
.category { min-width: 0; max-width: 100%; }
.seg { flex-wrap: wrap; }
.seg .opt { min-height: 32px; color: var(--ink); }
.seg .opt.on { color: var(--ground); }
.axis .stop5 { height: 32px; flex: 0 0 34px; }
.axis .state.unmarked, .axis .anchors5 { color: var(--ink); }
.prose-field { overflow-wrap: anywhere; min-height: 1.4em; overflow-y: hidden; }
.prose-field::placeholder { color: var(--ink); opacity: 1; }
.chip-toggle { min-height: 32px; color: var(--ink); }
.chip-toggle.on { color: var(--ground); }
[aria-checked="true"], [aria-pressed="true"].chip-toggle { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.text-control { min-height: 24px; }
[hidden] { display: none !important; }
#form-status { margin-top: var(--gap-m); overflow-wrap: anywhere; }
.field-error { display: block; max-width: 24ch; font-size: var(--size-small-print); margin-top: var(--gap-xs); }
[aria-invalid="true"] { outline: var(--focus-outline-width) solid var(--ink); outline-offset: var(--focus-outline-offset); }
#variant-nav button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (max-width: 600px) {
  .frame { padding: var(--gap-m); }
  .field-row label { max-width: 100%; }
  .ink-field, .prose-field { font-size: 1rem; }
  .pen .saves { flex-wrap: wrap; }
}
@media (forced-colors: active) {
  .on { outline: 2px solid Highlight; }
}

/* Local type roles: notebook headings, compact labels, quiet metadata, written prose. */
.app {
  --type-section: 0.875rem;
  --type-label: 0.75rem;
  --type-control: 0.8125rem;
  --type-note: 1rem;
  --leading-note: 1.5;
}
.region-name { font-size: var(--type-section); font-weight: 600; line-height: 1.35; letter-spacing: 0.035em; }
.lbl { font-size: var(--type-label); font-weight: 500; line-height: 1.35; letter-spacing: 0.025em; }
.axis .name { font-size: var(--type-label); font-weight: 600; letter-spacing: 0.025em; line-height: 1.35; }
.axis .head { gap: var(--gap-xs); align-items: baseline; }
.axis .state, .axis .state.unmarked, .axis .state.pen {
  font-family: var(--face-grotesk); font-size: var(--type-label); font-style: normal;
  font-weight: 400; line-height: 1.35; font-variant-numeric: tabular-nums;
}
.axis .anchors5 { line-height: 1.3; letter-spacing: 0; }
.seg .opt, .chip-toggle { font-size: var(--type-control); line-height: 1.3; letter-spacing: 0; }
.seg .opt { padding-inline: 8px; }
.text-control { font-size: var(--type-control); line-height: 1.3; white-space: nowrap; }
.prose-field { font-size: var(--type-note); line-height: var(--leading-note); max-width: 70ch; }
.prose-field::placeholder { font-style: italic; }
.helper { font-family: var(--face-grotesk); font-size: var(--type-control); line-height: 1.4; font-weight: 400; font-style: normal; text-transform: none; letter-spacing: 0; color: var(--ink); }
.field-unit .u { line-height: 1.3; }
.field-error { font-size: var(--type-control); font-weight: 400; line-height: 1.4; text-transform: none; letter-spacing: 0; }
#form-status { font-size: var(--type-control); line-height: 1.5; max-width: 70ch; }

</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" data-v="A" onclick="setVariant('A')">A: How did it turn out? before Texture &amp; flavor</button>
  <button class="variant-tab" data-v="C" onclick="setVariant('C')">C: How did it turn out? after Texture &amp; flavor</button>
  <span class="sep"></span>
  <button data-c="1" onclick="setCols(1)">Axes: 1 column</button>
  <button data-c="2" onclick="setCols(2)">Axes: 2 columns</button>
  <button data-c="3" class="active" onclick="setCols(3)">Axes: 3 columns</button>
  <span class="sep"></span>
  <button data-t="visible" onclick="setTastingMode('visible')">Tasting: always visible</button>
  <button data-t="hidden" class="active" onclick="setTastingMode('hidden')">Tasting: hidden until added</button>
  <span class="sep"></span>
  <button onclick="toggleRuler()">Toggle 100px ruler</button>
  <span class="note">Compare tasting always-visible vs. hidden-until-added; Save batch and Clear/Add/Remove tasting make its optionality explicit either way</span>
</div>

<div class="frame">
<div class="app" id="app" data-variant="A" data-cols="3">
  <div class="ruler" id="ruler" style="display:none"></div>

  <div class="pen">
    <section class="churn">
      <h2 class="region-name">Batch — churned</h2>
      <div class="field-row">
        <label class="f-date"><span class="lbl">Churn date</span><input class="ink-field num-field" type="date" value="2026-08-02"></label>
        <label><span class="lbl">Time to draw temp.</span><span class="field-unit"><input class="ink-field num-field"><span class="u">min</span></span></label>
        <label><span class="lbl">Out of machine</span><span class="field-unit"><input class="ink-field num-field"><span class="u">°C</span></span></label>
        <label><span class="lbl">Churn duration</span><span class="field-unit"><input class="ink-field num-field"><span class="u">min</span></span></label>
      </div>

      <div class="category-row">
        <div class="category">
          <label><span class="lbl">Exit consistency</span></label>
          <div class="seg" id="seg-exit">
            <button class="opt" data-v="ribbon">Smooth ribbon</button>
            <button class="opt" data-v="soupy">Wet, soupy</button>
            <button class="opt" data-v="chunky">Chunky, separated</button>
          </div>
        </div>
        <div class="category">
          <label><span class="lbl">Airiness (estimated)</span></label>
          <div class="seg" id="seg-overrun">
            <button class="opt" data-v="low">Low, dense</button>
            <button class="opt" data-v="medium">Medium, standard</button>
            <button class="opt" data-v="high">High, airy</button>
          </div>
        </div>
      </div>

      <label><span class="lbl">At the machine</span><textarea class="prose-field" rows="2"></textarea></label>
      <label><span class="lbl">Ingredient notes</span><textarea class="prose-field" rows="2" placeholder="e.g. oil bottle opened 24 Jul"></textarea></label>

      <div class="saves" style="align-items:baseline" id="churn-saves">
        <button class="btn" onclick="announce('This is a sketch. Your entries have been kept; nothing was saved.')">Cancel</button>
        <button class="btn" onclick="previewSave(this)">Save batch</button>
      </div>
    </section>

    <section class="tasting">
      <div class="head" style="margin-bottom:var(--gap-s)">
        <h2 class="region-name" style="margin-bottom:0">Tasting <span class="helper">· optional</span> <span class="helper" id="tasting-hint">— leave anything you did not record blank</span></h2>
        <button class="text-control clear" id="tasting-toggle-btn" style="margin-left:auto" onclick="removeTasting()">Clear tasting</button>
      </div>
      <div id="tasting-body">
        <div class="field-row">
          <label class="f-date"><span class="lbl">Tasted</span><input class="ink-field num-field" type="date"></label>
          <label><span class="lbl">Tempering</span><span class="field-unit"><input class="ink-field num-field"><span class="u">min</span></span></label>
          <label><span class="lbl">Tasting temperature</span><span class="field-unit"><input class="ink-field num-field"><span class="u">°C</span></span></label>
        </div>

        <div class="note-block">
          <label><span class="lbl">How did it turn out?</span><textarea class="prose-field" rows="2" placeholder="e.g. flavor, texture, anything that stood out"></textarea></label>
        </div>

        <div class="texture-block">
          <div id="axes">
            <div class="axes-core"></div>
            <div class="axes-declared"></div>
          </div>

          <div class="defects-standalone">
            <div class="head" style="margin-bottom:var(--gap-xs)">
            <p class="lbl" style="margin:0">Any problems?</p>
            <p class="helper" style="margin:0">select all that apply</p>
          </div>
            <div class="defect-chips" role="group" aria-label="Any problems? Select all that apply">
              <button class="chip-toggle" aria-pressed="false" onclick="toggleChip(this)">Coarse, icy</button>
              <button class="chip-toggle" aria-pressed="false" onclick="toggleChip(this)">Sandy, gritty</button>
              <button class="chip-toggle" aria-pressed="false" onclick="toggleChip(this)">Gummy, elastic</button>
              <button class="chip-toggle" aria-pressed="false" onclick="toggleChip(this)">Greasy film</button>
              <button class="chip-toggle declared-flaw" aria-pressed="false" onclick="toggleChip(this)">Bitter</button>
            </div>
          </div>
        </div>

        <div class="melt-block">
          <div class="field-row" style="align-items:flex-start">
            <label><span class="lbl">Melt test (optional)</span><span class="field-unit"><input class="ink-field num-field"><span class="u">g lost at 20 min</span></span></label>
            <div class="category">
              <label><span class="lbl">Melt style (optional)</span></label>
              <div class="seg" id="seg-melt">
                <button class="opt" data-v="weeping">Watery, weeping</button>
                <button class="opt" data-v="puddle">Creamy puddle</button>
                <button class="opt" data-v="foam">Stable foam</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <label class="next-time-shared"><span class="lbl">Next time</span><textarea class="prose-field" rows="2" placeholder="optional — for the batch, the tasting, or both"></textarea></label>

    <p id="form-status" role="status" aria-live="polite"></p>
    <div class="saves" style="align-items:baseline">
      <button class="btn" onclick="announce('This is a sketch. Your entries have been kept; nothing was saved.')">Cancel</button>
      <button id="save-combined" class="btn" onclick="previewSave(this)">Save batch &amp; tasting</button>
      <button class="text-control" id="add-tasting-closed" hidden onclick="addTasting()">Add tasting</button>
      <button id="undo-tasting" class="text-control" hidden onclick="undoTasting()">Undo clear tasting</button>
    </div>
  </div>
</div>
</div>

<script>
const AXES = [
  ['Hardness', 'soft', 'right', 'hard'],
  ['Scoopability', 'crumbly', 'right', 'gummy'],
  ['Smoothness', 'grainy', 'right', 'smooth'],
  ['Sweetness', 'less', 'right', 'more'],
  ['Body', 'thin', 'right', 'heavy'],
  ['Oil', 'faint', 'right', 'strong'],
];

function announce(message) {
  document.getElementById('form-status').textContent = message;
}

let statusTimer = null;
function announceTransient(message) {
  const status = document.getElementById('form-status');
  announce(message);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { if (status.textContent === message) status.textContent = ''; }, 5000);
}

function selectRadio(group, selected) {
  const buttons = [...group.querySelectorAll('[role="radio"]')];
  buttons.forEach((button, index) => {
    const on = button === selected;
    button.classList.toggle('on', on);
    button.setAttribute('aria-checked', String(on));
    button.tabIndex = on || (!selected && index === 0) ? 0 : -1;
  });
  const axis = group.closest('.axis');
  if (axis) updateAxisState(axis);
  updateSaveLabel();
}

function wireRadioGroup(group) {
  const buttons = [...group.querySelectorAll('button')];
  const inTasting = !!group.closest('#tasting-body');
  group.setAttribute('role', 'radiogroup');
  buttons.forEach((button, index) => {
    button.setAttribute('role', 'radio');
    button.setAttribute('aria-checked', 'false');
    button.tabIndex = index === 0 ? 0 : -1;
    button.addEventListener('click', () => { if (inTasting) forgetUndo(); selectRadio(group, button.classList.contains('on') ? null : button); });
    button.addEventListener('keydown', event => {
      const moves = {ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1};
      if (!(event.key in moves) && event.key !== 'Home' && event.key !== 'End') return;
      event.preventDefault();
      if (inTasting) forgetUndo();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 : (index + moves[event.key] + buttons.length) % buttons.length;
      selectRadio(group, buttons[next]);
      buttons[next].focus();
    });
  });
}

function clearAxis(button) {
  forgetUndo();
  const axis = button.closest('.axis');
  selectRadio(axis.querySelector('.stops5'), null);
  axis.querySelector('.stop5').focus();
  announce(axis.querySelector('.name').textContent + ' cleared.');
}

function updateAxisState(axis) {
  const selected = axis.querySelector('.stop5.on');
  const state = axis.querySelector('.state');
  state.textContent = selected ? `(${Number(selected.dataset.i) + 1})` : '(Not recorded)';
  state.className = selected ? 'state pen' : 'state unmarked';
  axis.querySelector('.clear').hidden = !selected;
}

const narrowAxes = window.matchMedia('(max-width: 760px)');
narrowAxes.addEventListener('change', renderAxes);

function renderAxes() {
  // Re-rendering replaces the stop buttons: carry marked stops across by axis id,
  // and retire any captured undo state (its element references went stale).
  const marked = {};
  document.querySelectorAll('#axes .axis').forEach(axis => {
    const on = axis.querySelector('.stop5.on');
    if (on) marked[axis.querySelector('.name').id] = on.dataset.i;
  });
  forgetUndo();
  const flat = document.getElementById('app').dataset.cols === '3' && !narrowAxes.matches;
  const axisMarkup = (index) => {
    const [name, lo, mid, hi] = AXES[index];
    const words = [lo, `leaning ${lo}`, mid, `leaning ${hi}`, hi];
    const cue = index === 4 ? '<p class="lbl" style="margin:0 0 var(--gap-xs)">Declared for this recipe</p>' : '';
    return `<div class="axis${index >= 4 ? ' axis--declared' : ''}">${cue}
      <div class="head"><span class="name" id="axis-${index}">${name}</span>
      <span class="state unmarked">(Not recorded)</span>
      <button class="text-control clear" hidden aria-label="Clear ${name}" onclick="clearAxis(this)">Clear</button></div>
      <div class="stops5" aria-labelledby="axis-${index}">${words.map((word, i) => `<button class="stop5" data-i="${i}" aria-label="${i + 1}: ${word}">${i + 1}</button>`).join('')}</div>
      <div class="anchors5" aria-hidden="true"><span>${lo}</span><span>${mid}</span><span>${hi}</span></div>
    </div>`;
  };
  document.getElementById('axes').innerHTML = flat
    ? [0, 1, 4, 2, 3, 5].map(axisMarkup).join('') + '<div class="axes-rule" aria-hidden="true"></div>'
    : '<div class="axes-core">' + [0, 1, 2, 3].map(axisMarkup).join('') + '</div><div class="axes-declared">' + [4, 5].map(axisMarkup).join('') + '</div>';
  document.querySelectorAll('.stops5').forEach(wireRadioGroup);
  document.querySelectorAll('#axes .axis').forEach(axis => {
    const id = axis.querySelector('.name').id;
    if (marked[id]) selectRadio(axis.querySelector('.stops5'), axis.querySelector('.stop5[data-i="' + marked[id] + '"]'));
  });
}

function toggleChip(button) {
  forgetUndo();
  const on = button.getAttribute('aria-pressed') !== 'true';
  button.setAttribute('aria-pressed', String(on));
  button.classList.toggle('on', on);
  updateSaveLabel();
}

function setCols(n) {
  document.getElementById('app').dataset.cols = n;
  document.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('active', Number(b.dataset.c) === n));
  document.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.c) === n)));
  renderAxes();
  updateRuler();
}

let variant = 'A';
function setVariant(v) {
  variant = v;
  document.getElementById('app').dataset.variant = v;
  document.querySelectorAll('.variant-tab').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  document.querySelectorAll('.variant-tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  const body = document.getElementById('tasting-body');
  const note = body.querySelector('.note-block');
  const texture = body.querySelector('.texture-block');
  if (v === 'A') body.insertBefore(note, texture);
  else body.insertBefore(texture, note);
  updateRuler();
}

let rulerOn = false;
function updateRuler() {
  if (!rulerOn) return;
  const app = document.getElementById('app');
  const ruler = document.getElementById('ruler');
  const h = app.offsetHeight;
  ruler.style.height = h + 'px';
  let marks = '';
  for (let y = 0; y <= h; y += 100) marks += `<span class="mark" style="top:${y}px">${y}</span>`;
  ruler.innerHTML = marks;
}
function toggleRuler() {
  rulerOn = !rulerOn;
  document.getElementById('ruler').style.display = rulerOn ? 'block' : 'none';
  updateRuler();
}
let clearedTasting = null;
function forgetUndo() {
  clearedTasting = null;
  document.getElementById('undo-tasting').hidden = true;
}
let tastingMode = 'hidden';
let tastingOpen = true;
function setTastingMode(mode) {
  tastingMode = mode;
  document.querySelectorAll('[data-t]').forEach(b => {
    const on = b.dataset.t === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  if (mode === 'hidden') tastingOpen = [...document.querySelectorAll('#tasting-body input, #tasting-body textarea')].some(f => f.value) || document.querySelector('#tasting-body .on');
  renderTastingVisibility();
}
function addTasting() {
  tastingOpen = true;
  renderTastingVisibility();
  document.querySelector('#tasting-body input, #tasting-body textarea')?.focus();
  announce('');
}
function renderTastingVisibility() {
  const closed = tastingMode === 'hidden' && !tastingOpen;
  document.querySelector('.tasting').hidden = closed;
  document.getElementById('churn-saves').hidden = closed;
  document.getElementById('add-tasting-closed').hidden = !closed;
  const btn = document.getElementById('tasting-toggle-btn');
  btn.textContent = tastingMode === 'hidden' ? 'Remove tasting' : 'Clear tasting';
  btn.onclick = removeTasting;
  updateSaveLabel();
  updateRuler();
}
function updateSaveLabel() {
  const closed = tastingMode === 'hidden' && !tastingOpen;
  document.getElementById('save-combined').textContent = closed ? 'Save batch' : 'Save batch & tasting';
}
function resizeNote(field) {
  field.style.height = 'auto';
  field.style.height = (field.scrollHeight + 2) + 'px';
}
function removeTasting() {
  const body = document.getElementById('tasting-body');
  const hasData = [...body.querySelectorAll('input, textarea')].some(f => f.value) || body.querySelector('.on');
  if (hasData) {
    clearedTasting = {
      fields: [...body.querySelectorAll('input, textarea')].map(f => [f, f.value]),
      selected: [...body.querySelectorAll('.on')]
    };
    body.querySelectorAll('input, textarea').forEach(f => { f.value = ''; clearError(f); });
    body.querySelectorAll('[role="radiogroup"]').forEach(group => selectRadio(group, null));
    body.querySelectorAll('.chip-toggle').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
    body.querySelectorAll('textarea').forEach(resizeNote);
    document.getElementById('undo-tasting').hidden = false;
    updateSaveLabel();
  } else if (tastingMode !== 'hidden') {
    return;
  }
  if (tastingMode === 'hidden') {
    tastingOpen = false;
    renderTastingVisibility();
    document.getElementById('add-tasting-closed').focus();
    announceTransient(hasData ? 'Tasting removed. You can undo this.' : 'Tasting removed.');
  } else {
    announceTransient('Tasting cleared. You can undo this.');
  }
  updateRuler();
}
function undoTasting() {
  if (!clearedTasting) return;
  if (tastingMode === 'hidden') { tastingOpen = true; renderTastingVisibility(); }
  clearedTasting.fields.forEach(([field, value]) => { field.value = value; });
  clearedTasting.selected.forEach(button => {
    if (button.matches('[role="radio"]')) selectRadio(button.parentElement, button);
    else { button.classList.add('on'); button.setAttribute('aria-pressed', 'true'); }
  });
  document.querySelectorAll('textarea').forEach(resizeNote);
  document.getElementById('undo-tasting').hidden = true;
  document.getElementById('tasting-toggle-btn').focus();
  clearedTasting = null;
  updateSaveLabel();
  announceTransient('Tasting restored.');
  updateRuler();
}
function clearError(field) {
  field.removeAttribute('aria-invalid');
  field.removeAttribute('aria-describedby');
  document.getElementById(field.id + '-error')?.remove();
}
function previewSave(button) {
  const scope = button.closest('.churn') || document.querySelector('.pen');
  let firstInvalid;
  scope.querySelectorAll('input:not([type="date"])').forEach(field => {
    clearError(field);
    const raw = field.value.trim().replace(/−/g, '-');
    const signed = field.closest('label').textContent.includes('°C');
    if (!raw || (/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(raw) && Number.isFinite(Number(raw.replace(',', '.'))) && (signed || Number(raw.replace(',', '.')) >= 0))) return;
    field.setAttribute('aria-invalid', 'true');
    const error = document.createElement('span');
    error.id = field.id + '-error';
    error.className = 'field-error';
    error.textContent = signed ? 'Enter a temperature, such as −6, or leave blank.' : 'Enter zero or a positive number, or leave blank.';
    field.setAttribute('aria-describedby', error.id);
    field.closest('label').append(error);
    firstInvalid ||= field;
  });
  if (firstInvalid) { announce('Check the marked measurements. Your entries have been kept.'); firstInvalid.focus(); return; }
  announce('Sketch preview checked. Nothing has been saved; your entries remain here.');
}

renderAxes();
[['seg-exit', 'Exit consistency'], ['seg-overrun', 'Airiness (estimated)'], ['seg-melt', 'Melt style (optional)']].forEach(([id, label]) => {
  const group = document.getElementById(id);
  group.setAttribute('aria-label', label);
  wireRadioGroup(group);
});
document.querySelectorAll('input').forEach((field, i) => {
  field.id ||= 'measurement-' + i;
  if (field.type !== 'date') field.inputMode = 'decimal';
  field.addEventListener('input', () => { if (field.closest('#tasting-body')) forgetUndo(); clearError(field); updateSaveLabel(); });
});
document.querySelectorAll('textarea').forEach(field => {
  field.dir = 'auto';
  field.addEventListener('input', () => { if (field.closest('#tasting-body')) forgetUndo(); resizeNote(field); updateSaveLabel(); updateRuler(); });
  resizeNote(field);
});
setCols(3);
setVariant('A');
setTastingMode('hidden');
updateSaveLabel();
window.addEventListener('resize', () => { document.querySelectorAll('textarea').forEach(resizeNote); updateRuler(); });
</script>
</body>
</html>
